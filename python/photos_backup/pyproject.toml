[project]
name = "photos_backup"
version = "0.1.0"
description = "Opinionated backup solution for Apple Photos on macOS"
authors = [{ name = "Sébastien Lavoie", email = "sgdlavoie@gmail.com" }]
dependencies = [
    "click>=8.4.2",
    # Private PhotoKit/export hooks are tested against this exact release.
    "osxphotos==0.77.2",
    "rich>=13.5.2,<14",
    "rich-click>=1.9,<2",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.1",
]

[project.scripts]
photos-backup = "photos_backup.cli.cli:cli"
cli = "photos_backup.cli.cli:cli"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/photos_backup"]

[tool.mypy]
python_version = "3.12"
files = ["src/photos_backup"]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["osxphotos", "osxphotos.*"]
follow_imports = "skip"
ignore_missing_imports = true
