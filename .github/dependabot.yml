version: 2

updates:
  - package-ecosystem: "gomod"
    directories:
      - "/go/*"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directories:
      - "/typescript/*"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Requirements files, Pipenv, and Python projects without a uv lockfile.
  - package-ecosystem: "pip"
    directories:
      - "/python/filter_vscode_issues"
      - "/python/har_media_downloader"
      - "/python/haveibeenpwnwed_password_checker"
      - "/python/learning-logs-to-markdown"
      - "/python/password_validator"
      - "/python/zsh_history_cleaner"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep uv lockfiles and their project manifests updated together.
  - package-ecosystem: "uv"
    directories:
      - "/python/gitbrief"
      - "/python/photos_backup"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch-security:
        applies-to: "security-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
